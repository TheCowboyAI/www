[package]
name = "thecowboyai-www"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["web", "image", "svg"] }
wasm-bindgen = "0.2"
web-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true