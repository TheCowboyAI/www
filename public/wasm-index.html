<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowboy AI - The Platform For Composable, Cognitive, Audit-Grade AI Swarms</title>
    <meta name="description" content="Your New Business Brain & Nervous System. Cognition. Evolution. Security. Trust. No-Code Composable Multi-AI Agent Orchestration At Scale">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 1000;
        }
        
        #loading h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        
        #loading p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 2rem auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        noscript {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            text-align: center;
        }
    </style>
</head>
<body>
    <noscript>
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript to view the Cowboy AI presentation.</p>
    </noscript>
    
    <div id="loading">
        <h1>🤠 Cowboy AI</h1>
        <div class="spinner"></div>
        <p>Loading presentation...</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script type="module">
        import init, { run } from './wasm-pkg/cowboy_presentation.js';
        
        async function main() {
            try {
                console.log('Initializing Cowboy AI Presentation...');
                
                // Initialize the WASM module
                await init();
                
                console.log('WASM module loaded successfully');
                
                // Hide the loading screen
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.transition = 'opacity 0.5s';
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 500);
                }
                
                // Start the Iced application
                console.log('Starting Iced application...');
                run();
                
            } catch (error) {
                console.error('Failed to load presentation:', error);
                
                // Show error message
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.innerHTML = `
                        <h1>⚠️ Error</h1>
                        <p>Failed to load the presentation.</p>
                        <p style="font-size: 0.9rem; margin-top: 1rem; opacity: 0.7;">
                            ${error.message || 'Unknown error occurred'}
                        </p>
                        <button onclick="location.reload()" style="
                            margin-top: 1rem;
                            padding: 0.5rem 1.5rem;
                            background: white;
                            color: #667eea;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;
                            font-size: 1rem;
                        ">Retry</button>
                    `;
                }
            }
        }
        
        // Start the application when the page loads
        main();
    </script>
</body>
</html>
