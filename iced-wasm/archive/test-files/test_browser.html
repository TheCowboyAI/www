<!DOCTYPE html>
<html>
<head>
    <title>WASM Test</title>
</head>
<body>
    <h1>Browser Console Test</h1>
    <p>Open browser console to see WASM output</p>
    <iframe src="http://localhost:8090" width="100%" height="600" style="border: 2px solid blue;"></iframe>
    
    <script>
        // Test if we can access the iframe
        setTimeout(() => {
            const iframe = document.querySelector('iframe');
            console.log('Iframe loaded:', iframe);
            
            // Try to check if there's a canvas
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const canvas = iframeDoc.querySelector('canvas');
                console.log('Canvas found in iframe:', canvas);
                if (canvas) {
                    console.log('Canvas size:', canvas.width, 'x', canvas.height);
                }
            } catch (e) {
                console.log('Cannot access iframe (cross-origin):', e.message);
            }
        }, 3000);
    </script>
</body>
</html>
