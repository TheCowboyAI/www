[package]
name = "cowboy-presentation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Use standard iced crate with webgl feature
# Note: wgpu feature is needed for iced_renderer in release mode
iced = { version = "0.13.1", default-features = false, features = ["wgpu", "webgl", "canvas", "image", "svg", "debug"] }

# WASM specific dependencies
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Window", "Element", "HtmlElement", "HtmlHeadElement", "CssStyleDeclaration", "HtmlCanvasElement", "NodeList", "Performance", "HtmlImageElement", "HtmlInputElement", "HtmlButtonElement", "Event"] }
console_error_panic_hook = "0.1"

# Use wgpu 0.19 to match iced's version
wgpu = { version = "0.19", features = ["webgl"] }

# Other dependencies
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
