[package]
name = "cowboy-presentation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Use standard iced crate with webgl feature
iced = { version = "0.13.1", default-features = false, features = ["webgl", "canvas", "image", "svg", "debug"] }

# Individual iced crates for manual integration
iced_wgpu = { version = "0.13", features = ["webgl", "image"] }
iced_core = { version = "0.13" }
iced_widget = { version = "0.13" }
iced_runtime = { version = "0.13" }

# WASM specific dependencies
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Document", "Window", "Element", "HtmlElement", "HtmlHeadElement", "CssStyleDeclaration", "HtmlCanvasElement", "NodeList", "Performance", "HtmlImageElement", "HtmlInputElement", "HtmlButtonElement", "Event"] }
console_error_panic_hook = "0.1"

# WebGL/wgpu for minimal test
wgpu = { version = "0.20", features = ["webgl"] }

# Other dependencies
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
